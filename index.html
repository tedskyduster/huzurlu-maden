<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Huzurlu Maden</title>
<style>
:root{--cream:#fff7ea;--cream2:#f6e7cf;--brown:#7a4e33;--brown2:#a8754f;--ink:#4a3426;--gold:#e9a727;--pink:#ef8fb0;--green:#6fae55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3d9a8;font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{display:block;width:100vw;height:100vh;cursor:pointer;touch-action:none}
.pill{background:var(--cream);border:3px solid var(--brown);border-radius:16px;box-shadow:0 4px 0 rgba(90,55,30,.35);padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:800}
#hud{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#goldPill{font-size:22px}
#bagPill{font-size:15px;flex-direction:column;align-items:stretch;gap:4px;min-width:170px}
#bagPill .row{display:flex;align-items:center;gap:8px}
.bar{height:10px;border-radius:6px;background:#ead6b6;overflow:hidden;border:2px solid #c9a77f}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd06f,#5fae55);transition:width .25s}
.bar.full i{background:linear-gradient(90deg,#ffc36b,#f29a4a)}
#bagIcons{display:flex;flex-wrap:wrap;max-width:200px;gap:6px 8px;font-size:13px;font-weight:800}
#bagIcons span{display:flex;align-items:center;gap:2px}
#fav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:14px;pointer-events:none;white-space:nowrap}
#fav b{color:#c2577d}
#btns{position:fixed;right:12px;top:12px;display:flex;gap:8px}
.btn{font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:var(--cream);border:3px solid var(--brown);border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 rgba(90,55,30,.35);cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,55,30,.35)}
.btn svg{width:20px;height:20px}
.btn.gold{background:linear-gradient(#ffe08a,#f5bd3c);border-color:#a8701f}
.btn.green{background:linear-gradient(#bfe8a0,#86c765);border-color:#4f8a3a}
.btn[disabled]{opacity:.55;cursor:default;filter:grayscale(.4)}
#sellPrompt{position:fixed;display:none;transform:translate(-50%,-100%);z-index:5;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
#zone{position:fixed;left:50%;top:15%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;color:#fff;z-index:4;text-shadow:0 2px 0 rgba(90,55,30,.65),0 0 14px rgba(90,55,30,.45);white-space:nowrap}
#zone b{display:block;font-size:32px;font-weight:900;letter-spacing:.5px}#zone span{font-size:15px;font-weight:800}
#zone.show{animation:zoneA 3.4s ease forwards}
@keyframes zoneA{0%{opacity:0;transform:translate(-50%,10px)}14%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.toast{background:var(--cream);border:3px solid var(--brown);border-radius:14px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(90,55,30,.3);animation:tin .35s ease-out,tout .5s ease-in forwards;animation-delay:0s,var(--d,2.6s)}
.toast.special{background:linear-gradient(#fff6c9,#ffe7a0);border-color:#b07a1f}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#panelWrap{position:fixed;inset:0;background:rgba(80,50,30,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#panel{width:min(620px,100%);max-height:min(640px,94vh);background:var(--cream);border:4px solid var(--brown);border-radius:22px;box-shadow:0 8px 0 rgba(90,55,30,.35);display:flex;flex-direction:column;overflow:hidden}
#panelHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:repeating-linear-gradient(90deg,#e65c5c 0 28px,#fff 28px 56px);border-bottom:4px solid var(--brown)}
#panelHead h2{margin:0;font-size:20px;background:var(--cream);border:3px solid var(--brown);border-radius:12px;padding:4px 12px}
#panelHead.set{background:repeating-linear-gradient(90deg,#9aa7b8 0 28px,#b9c3d0 28px 56px)}
.setrow{gap:12px}.setrow input[type=range]{width:min(180px,36vw);accent-color:#7a4e33;height:28px}
.btn.red{background:linear-gradient(#ffb0a0,#e66a5a);border-color:#9a3a2e;color:#fff}
.item.danger{background:#fff1ee;border-color:#f2c4bb}
.confirm{background:#fff6f3;border:3px solid #e66a5a;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.confirm .nm{font-weight:900;font-size:16px}.confirm .ds{font-size:13px}.cbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
#resetOv{position:fixed;inset:0;z-index:50;background:#fff7ea;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#7a4e33;animation:tin .4s ease-out}
.btn:focus-visible{outline:3px solid #4d79b8;outline-offset:2px}
#panelHead.tailor{background:repeating-linear-gradient(90deg,#c06c9a 0 28px,#f6ecd8 28px 56px)}#panelHead.smith{background:repeating-linear-gradient(90deg,#6b6f78 0 28px,#8a8f99 28px 56px)}#panelHead.cart{background:repeating-linear-gradient(90deg,#b5543a 0 28px,#d07a5a 28px 56px)}#panelHead.fish{background:repeating-linear-gradient(90deg,#4d79b8 0 28px,#7aa6d8 28px 56px)}
.pvBox{display:flex;gap:12px;align-items:center;background:linear-gradient(#eef6e4,#dcebc8);border:2px solid #cfe0b8;border-radius:16px;padding:8px}
.pvBox canvas{width:150px;height:156px;flex:none}
.pvInfo{display:flex;flex-direction:column;gap:6px;font-size:13px}.pvInfo b{font-size:15px}.pvInfo .btn{align-self:flex-start;font-size:13px;padding:5px 10px}
.item.cl{align-items:center}.item.cl.trying{border-color:#c06c9a;background:#fdf2f7}
.sw{display:flex;gap:6px;margin-top:5px}.swc{width:22px;height:22px;border-radius:50%;border:2px solid rgba(90,55,30,.35);cursor:pointer;padding:0}.swc.on{outline:3px solid #7a4e33;outline-offset:1px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#panelHead.book{background:repeating-linear-gradient(90deg,#8fbf6f 0 28px,#a9d08a 28px 56px)}
#closeBtn{padding:4px 10px;font-size:18px}
#tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.tab{font:inherit;font-weight:800;font-size:13px;border:3px solid var(--brown2);background:var(--cream2);color:var(--ink);border-radius:12px 12px 0 0;padding:6px 8px;cursor:pointer}
.tab.on{background:#fff;border-color:var(--brown)}
#panelBody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff;margin:0 12px 12px;border:3px solid var(--brown);border-radius:0 12px 12px 12px}
.item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--cream);border:2px solid #e6cfae}
.item canvas{width:52px;height:52px;flex:none;background:#fff3dc;border-radius:12px;border:2px solid #e6cfae}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:900;font-size:15px}
.item .ds{font-size:13px;opacity:.8}
.item .btn{font-size:14px;padding:6px 10px;white-space:nowrap}
.tag{font-size:12px;font-weight:900;color:#4f8a3a}
.sellBox{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:linear-gradient(#fff6dc,#fde9be);border:2px solid #e2c48d}
.sellRow{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.sellRow .hot{color:#c2577d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{background:var(--cream);border:2px solid #e6cfae;border-radius:14px;padding:8px;text-align:center;font-size:13px}
.card canvas{width:64px;height:64px}
.card .nm{font-weight:900;font-size:14px}
.card.locked canvas{filter:brightness(0) opacity(.18)}
.card.locked .nm{opacity:.5}
.sect{font-weight:900;font-size:15px;margin:8px 2px 0}
.trow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.trow.thead{font-size:12px;font-weight:900;opacity:.6;padding:0 4px}
.slot{display:flex;align-items:center;gap:6px;background:var(--cream);border:2px solid #e6cfae;border-radius:12px;padding:4px 6px;min-height:50px;font-size:12px}
.slot canvas{flex:none}
.slot .snm{font-weight:900;font-size:12.5px;line-height:1.15}
.slot .sq{font-size:11px;opacity:.7}
.slot.locked canvas{filter:brightness(0) opacity(.2)}
.slot.locked .snm{opacity:.45}
.slot.empty{background:transparent;border-style:dashed;border-color:#efe2cc}
@media(max-width:600px){.slot{flex-direction:column;text-align:center;padding:4px}}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(255,240,210,.55),rgba(150,100,60,.45));z-index:20;padding:16px}
#intro .card2{background:var(--cream);border:4px solid var(--brown);border-radius:24px;box-shadow:0 8px 0 rgba(90,55,30,.35);padding:20px 22px;max-width:560px;width:100%;text-align:center;max-height:96vh;overflow:auto}
.selT{font-weight:900;font-size:17px;margin:12px 0 8px}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.heroC{font:inherit;color:var(--ink);background:#fff;border:3px solid #e6cfae;border-radius:18px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s,border-color .12s,box-shadow .12s}
.heroC:hover{transform:translateY(-2px)}
.heroC.on{border-color:var(--green);box-shadow:0 0 0 4px rgba(111,174,85,.3);background:#f6fbef}
.heroC canvas{width:130px;height:125px;border-radius:14px;background:radial-gradient(circle at 50% 60%,#e7f3d6,#cfe5b8)}
.heroC b{font-size:20px}
.heroC span{font-size:12.5px;line-height:1.35;opacity:.85}
.heroC:focus-visible{outline:3px solid #4d79b8;outline-offset:2px}
@media(max-width:480px){.heroC canvas{width:104px;height:100px}.heroC span{font-size:11.5px}}
#intro h1{margin:0 0 4px;font-size:30px;color:#7a4e33}
#intro p{margin:6px 0;font-size:15px;line-height:1.45}
#startBtn[disabled]{opacity:.6}
#intro .keys{font-size:13px;opacity:.85;margin:12px 0}
#intro .btn{margin:8px auto 0;font-size:20px;padding:10px 26px}
.hidden{display:none!important}
#actBtn{position:fixed;right:16px;bottom:64px;width:78px;height:78px;border-radius:50%;flex-direction:column;justify-content:center;gap:0;padding:0;z-index:6;display:none;background:radial-gradient(circle at 40% 35%,#fff7ea,#f2dfbf);font-size:14px}
#actBtn.bite{background:radial-gradient(circle at 40% 35%,#ffd9d3,#f29a8a);animation:bob .5s infinite}
@media (pointer:coarse){#actBtn{display:flex}}
.btn,.heroC,.tab,.swc{touch-action:manipulation;-webkit-touch-callout:none}
@media (max-width:600px){#goldPill{font-size:17px;padding:4px 10px}#bagPill{min-width:128px;font-size:13px;padding:4px 10px}#bagIcons{max-width:140px}
  #btns{flex-direction:column;top:10px;right:10px;gap:6px}.btn{font-size:13px;padding:7px 8px}.btn span.l{display:none}
  #fav{font-size:11px;bottom:10px;padding:4px 10px}#zone b{font-size:22px}#zone span{font-size:12px}#zone{top:20%}
  #toast{top:auto;bottom:150px;flex-direction:column-reverse;width:86vw}.toast{font-size:13px;text-align:center}
  #actBtn{bottom:52px;right:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill" id="goldPill"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c542" stroke="#a8701f" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#d99a24" stroke-width="2"/></svg><b id="gold">0</b></div>

  </div>
</div>

<div id="btns">
  <button class="btn" id="bShop" title="Pazar (P)"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5z" fill="#e65c5c" stroke="#7a4e33" stroke-width="1.8"/><path d="M4 9v11h16V9" fill="#fff3dc" stroke="#7a4e33" stroke-width="1.8"/><rect x="9" y="13" width="6" height="7" fill="#c98a55" stroke="#7a4e33" stroke-width="1.5"/></svg><span class="l">Pazar</span></button>
  <button class="btn" id="bWard" title="Gardırop (G)"><svg viewBox="0 0 24 24"><path d="M12 6a2 2 0 1 1 2-2" fill="none" stroke="#7a4e33" stroke-width="1.8" stroke-linecap="round"/><path d="M12 6v2L3 15c-1 .8-.5 2 .8 2h16.4c1.3 0 1.8-1.2.8-2l-9-7" fill="#f6d6e4" stroke="#7a4e33" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="l">Gardırop</span></button>
  <button class="btn" id="bBook" title="Koleksiyon Defteri (B)"><svg viewBox="0 0 24 24"><path d="M4 4h7c1 0 1 1 1 1v15s0-1-1-1H4z" fill="#a9d08a" stroke="#4f6a3a" stroke-width="1.8"/><path d="M20 4h-7c-1 0-1 1-1 1v15s0-1 1-1h7z" fill="#c2e3a8" stroke="#4f6a3a" stroke-width="1.8"/></svg><span class="l">Defter</span></button>
  <button class="btn" id="bSet" title="Ayarlar (O)"><svg viewBox="0 0 24 24"><path d="M12 2.5l1.6 2.3 2.7-.7.6 2.7 2.6 1-.8 2.6 1.8 2.1-2.2 1.6.3 2.8-2.8.2-1.1 2.5-2.5-1.2-2.5 1.2-1.1-2.5-2.8-.2.3-2.8-2.2-1.6 1.8-2.1-.8-2.6 2.6-1 .6-2.7 2.7.7z" fill="#c9d0d8" stroke="#7a4e33" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="#fff7ea" stroke="#7a4e33" stroke-width="1.5"/></svg><span class="l">Ayarlar</span></button>
  <button class="btn" id="bMute" title="Ses (M)"><svg viewBox="0 0 24 24" id="muteIco"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f5c542" stroke="#7a4e33" stroke-width="1.8"/><path d="M16 8c2 2 2 6 0 8M18.5 5.5c3.5 3.5 3.5 9.5 0 13" fill="none" stroke="#7a4e33" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<button class="btn" id="actBtn" aria-label="Kaz"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 19L16 9" stroke="#8a5a3b" stroke-width="2.6" stroke-linecap="round"/><path d="M9 5c4-2 8 0 10 4" fill="none" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/></svg><b id="actTxt">Kaz</b></button>
<button class="btn gold" id="sellPrompt">Hepsini Sat</button>
<div id="fav" class="pill"></div>
<div id="toast"></div>
<div id="zone"></div>

<div id="panelWrap">
  <div id="panel">
    <div id="panelHead"><h2 id="panelTitle">Köy Pazarı</h2><button class="btn" id="closeBtn">✕</button></div>
    <div id="tabs"></div>
    <div id="panelBody"></div>
  </div>
</div>

<div id="intro">
  <div class="card2">
    <h1>Huzurlu Maden</h1>
    <p>Topla, balık tut, köyünü büyüt. Acele yok.</p>
    <div class="selT">Karakterini seç</div>
    <div class="heroes">
      <button class="heroC" data-h="f"><canvas width="260" height="250"></canvas><b>Umay</b><span></span></button>
      <button class="heroC" data-h="m"><canvas width="260" height="250"></canvas><b>Korkut</b><span></span></button>

  </div>
</div>

<script>
'use strict';
/* =========================================================
   Huzurlu Maden — cozy izometrik maden toplama oyunu
   Saf HTML5 Canvas + Web Audio, harici dosya yok.

// ---------- yardımcılar ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261126);
const rnd=(a,b)=>a+Math.random()*(b-a);

function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}
function unIso(sx,sy){const a=sx/(TW/2),b=sy/(TH/2);return{x:(a+b)/2,y:(b-a)/2}}
const $=id=>document.getElementById(id);
const cv=$('c');let ctx=cv.getContext('2d');
let DPR=1,CW=0,CH=0,ZOOM=1.4;

// ---------- oyun verisi ----------

  {name:'Ahşap Kazma',cost:0,power:1,swing:.58,col:'#b07a45',luck:0,desc:'Basit ama sevimli.'},
  {name:'Bakır Kazma',cost:30,power:2,swing:.49,col:'#e08a3c',luck:0,desc:'Kaynaklar daha az vuruşta kırılır · daha seri'},

  {name:'Ahşap El Arabası',cost:90,speed:1.2,cap:12,desc:'Arkandan iple gelir · Hız +%20 · Çanta +12'},

const FISH={
  kizilkanat:{name:'Kızılkanat',price:9,w:34,size:[12,25],col:'#d9734f'},
  sazan:{name:'Pullu Sazan',price:12,w:30,size:[25,55],col:'#c9a45c'},
  alabalik:{name:'Gökkuşağı Alabalığı',price:24,w:16,size:[25,50],col:'#9fbf7a'},
  yayin:{name:'Bıyıklı Yayın',price:48,w:7,size:[60,140],col:'#6b6f5a'},

    if(L.leaf){[[-14,2],[10,4],[-2,6]].forEach(([x,y],i)=>{c.save();c.translate(x,y);c.rotate(i);poly(c,[0,-3,1,-1,3,-1,1,1,2,3,0,2,-2,3,-1,1,-3,-1,-1,-1],L.leaf);c.restore()})}}
  else if(L.style==='mush'){shadow(c,0,1,10,3.5);[[-5,0,1],[4,-1,.8],[0,2,.6]].forEach(([mx,my,sc])=>{c.fillStyle='#f3e6cf';c.fillRect(mx-2*sc,my-8*sc,4*sc,8*sc);c.beginPath();c.ellipse(mx,my-8*sc,7*sc,5.5*sc,0,Math.PI,0);c.fillStyle=L.cap;c.fill();ell(c,mx-2*sc,my-11*sc,2*sc,1*sc,'rgba(255,255,255,.3)')})}
  else if(L.style==='vine'){c.fillStyle='#8a5a3b';c.fillRect(-1.5,-30,3,30);for(let i=0;i<5;i++){const yy=-4-i*5.5,xx=(i%2?4:-4)+sw*.5;leafShape(c,xx,yy,i%2?.9:-.9,7,3,'oval',L.leaf);ell(c,-xx*.6,yy-2,2.2,3.2,L.cone);c.strokeStyle=tint(L.cone,-30);c.lineWidth=.5;c.beginPath();c.moveTo(-xx*.6-2,yy-2);c.lineTo(-xx*.6+2,yy-2);c.stroke()}}
  else if(L.style==='ball'){shadow(c,0,1,10,3.5);c.fillStyle='#7a5a3b';c.fillRect(-2,-8,4,8);circ(c,0+sw*.4,-15,9,L.leaf);circ(c,-3+sw*.4,-17,4,tint(L.leaf,25));for(let i=0;i<6;i++)circ(c,Math.cos(i*1.1)*6+sw*.4,-15+Math.sin(i*1.1)*6,1.5,L.berry)}
  else{shadow(c,0,1,11,4);const n=L.shape==='grass'?7:6;for(let i=0;i<n;i++){const a=(i/(n-1)-.5)*1.6;leafShape(c,0,0,a+sw*.03,L.shape==='grass'?14:L.shape==='broad'?9:12,3,L.shape,tint(L.leaf,(i%2)*14))}
    if(L.flower){const fl=L.fshape;const pts=fl==='cluster'||fl==='spike'?[[-3,-18],[4,-21]]:[[-4,-16],[3,-19],[7,-14]];pts.forEach(([fx,fy],i)=>{c.strokeStyle='#5a8f45';c.lineWidth=1;c.beginPath();c.moveTo(0,-4);c.quadraticCurveTo(fx*.5,fy*.6,fx+sw,fy);c.stroke();flowerHead(c,fx+sw,fy,fl,L.flower,1,t)})}}}

  if(it.cat==='fish'){drawFishIcon(c,type);c.restore();return}
  const col=liveCol(type,I.c||it.col);

  case'ore':poly(c,[-7,0,-6,-7,0,-10,6,-7,7,0],I.rock);poly(c,[0,-10,6,-7,7,0,1,0],tint(I.rock,-20));circ(c,-2,-5,2,I.vein);circ(c,3,-3,1.6,I.vein);circ(c,1,-7.5,1.2,I.vein);break;

  case'mineral':c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.45;circ(c,0,-7,11,col);c.restore();crystal(c,-2,0,-.25,13,3.2,tint(col,30),col,'#fff');crystal(c,3,0,.3,10,2.6,tint(col,30),tint(col,-20));break;
  case'rough':{const st=I.style;if(st==='prism'){crystal(c,0,0,0,13,4,tint(col,30),tint(col,-30),'#fff');crystal(c,-4,0,-.4,8,2.6,tint(col,30),tint(col,-30))}
    else if(st==='glass')poly(c,[-6,0,-1,-13,6,-2,2,0],col);
    else if(st==='octa'){poly(c,[0,-13,6,-6,0,0,-6,-6],tint(col,20));poly(c,[0,-13,6,-6,0,-6],I.c2)}
    else if(st==='cube'){poly(c,[0,-12,6,-9,0,-6,-6,-9],tint(col,35));poly(c,[-6,-9,0,-6,0,0,-6,-3],col);poly(c,[0,-6,6,-9,6,-3,0,0],I.c2)}
    else if(st==='needle'){for(let i=0;i<5;i++)crystal(c,(i-2)*1.6,0,(i-2)*.22,12,1.2,col,I.c2)}
    else{circ(c,0,-5.5,6,col);if(type==='kantasi')for(let i=0;i<4;i++)circ(c,-3+i*2,-6+(i%2)*3,1,I.c2);else if(type==='lapis')for(let i=0;i<4;i++)circ(c,-3+i*2,-4-(i%2)*3,.6,I.c2);ell(c,-2,-8,2,1.2,'rgba(255,255,255,.6)')}
    if(type==='obsidyen'){c.strokeStyle='rgba(200,190,255,.7)';c.lineWidth=.8;c.beginPath();c.moveTo(-2,-10);c.lineTo(0,-3);c.stroke()}break}
  case'cut':poly(c,[-6,-6,-3,-11,3,-11,6,-6,0,1],tint(col,-15));poly(c,[-3,-11,3,-11,4,-7,-4,-7],tint(col,40));poly(c,[-6,-6,-4,-7,0,1],tint(col,15));poly(c,[6,-6,4,-7,0,1],tint(col,-35));ell(c,-1.5,-9.5,1.5,.6,'rgba(255,255,255,.9)');break;
  case'brilliant':c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.5;circ(c,0,-7,12,col);c.restore();poly(c,[-7,-7,-4,-12,4,-12,7,-7,0,2],col);poly(c,[-4,-12,4,-12,3,-8,-3,-8],tint(col,50));poly(c,[-7,-7,-3,-8,0,2],tint(col,25));poly(c,[7,-7,3,-8,0,2],tint(col,-40));star(c,4,-12,3.5,'#fff',time*2);break;
  case'log':c.fillStyle=I.bark;rr2(c,-8,-9,13,8,3);c.fill();ell(c,5,-5,3,4,I.core);c.strokeStyle=tint(I.core,-35);c.lineWidth=.6;c.beginPath();c.ellipse(5,-5,1.6,2.4,0,0,6.28);c.stroke();break;
  case'plank':poly(c,[-8,-3,4,-9,8,-6,-4,0],col);poly(c,[-8,-3,-4,0,-4,2,-8,-1],tint(col,-30));poly(c,[-4,0,8,-6,8,-4,-4,2],tint(col,-15));c.strokeStyle=tint(col,-25);c.lineWidth=.5;c.beginPath();c.moveTo(-5,-3);c.lineTo(5,-8);c.stroke();break;
  case'leaf':leafShape(c,0,0,.3,13,3.6,I.shape,col);break;
  case'sprig':c.strokeStyle='#7a5a3b';c.lineWidth=1;c.beginPath();c.moveTo(0,0);c.lineTo(0,-9);c.stroke();leafShape(c,0,-6,-.8,7,2.4,'oval',col);leafShape(c,0,-6,.8,7,2.4,'oval',col);for(let i=0;i<3;i++)circ(c,-2+i*2,-10+(i%2),1.4,I.b);break;
  case'nut':circ(c,0,-5,5.5,col);c.strokeStyle=tint(col,-35);c.lineWidth=.8;c.beginPath();c.moveTo(0,-10.5);c.lineTo(0,.5);c.moveTo(-3,-8);c.quadraticCurveTo(-1,-5,-3,-2);c.moveTo(3,-8);c.quadraticCurveTo(1,-5,3,-2);c.stroke();ell(c,-2,-8,1.4,.8,'rgba(255,255,255,.4)');break;
  case'seeds':for(let i=0;i<9;i++)ell(c,-5+(i%3)*5+(Math.floor(i/3)%2)*2,-2-Math.floor(i/3)*3,1.8,1.1,tint(col,(i%2)*20));break;
  case'berry':poly(c,[0,-12,4,-15,3,-11],'#7aae4a');[[-2,-4],[2,-5],[0,-8]].forEach(([bx,by])=>{circ(c,bx,by,2.8,col);circ(c,bx-.8,by-.8,.8,'#fff')});break;
  case'sprout':c.strokeStyle='#6a8f5a';c.lineWidth=1.4;c.beginPath();c.moveTo(0,0);c.lineTo(0,-12);c.stroke();leafShape(c,0,-4,-1,6,2.2,'oval',col);leafShape(c,0,-8,1,6,2.2,'oval',col);flowerHead(c,0,-13,'spike',ITEMS.adacayi?'#8a7fd0':col,.8);break;

  case'flower':if(I.glow){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.5;circ(c,0,-7,11,'#bfe0ff');c.restore()}c.strokeStyle='#5a8f45';c.lineWidth=1.2;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-1,-5,0,-8);c.stroke();leafShape(c,0,-2,-.7,6,2,'oval','#6aa05a');flowerHead(c,0,-9,I.f||'daisy',col,1.5);break;

  case'mushroom':c.fillStyle='#f3e6cf';c.fillRect(-2,-7,4,7);c.beginPath();c.ellipse(0,-7,7,5.5,0,Math.PI,0);c.fillStyle=col;c.fill();if(type==='sinek_mantari'){circ(c,-3,-9,1.2,'#fff');circ(c,2,-10.5,1,'#fff');circ(c,4,-8,.8,'#fff')}else ell(c,-2,-10,2,1,'rgba(255,255,255,.3)');break;
  case'shelf':c.fillStyle='#e8d8b8';c.fillRect(-1.5,-5,3,5);c.beginPath();c.ellipse(0,-6,8,4,0,Math.PI,0);c.fillStyle=col;c.fill();c.strokeStyle='#e0a050';c.lineWidth=1;c.beginPath();c.ellipse(0,-6,8,4,0,Math.PI,0);c.stroke();ell(c,-2,-8,3,1,'rgba(255,255,255,.35)');break;
  case'clover':c.strokeStyle='#3f7a3a';c.lineWidth=1.2;c.beginPath();c.moveTo(0,0);c.lineTo(0,-6);c.stroke();for(let i=0;i<4;i++){c.save();c.translate(0,-8);c.rotate(i*Math.PI/2+.78);c.fillStyle=col;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-4,-3,-2,-7,0,-4.5);c.bezierCurveTo(2,-7,4,-3,0,0);c.fill();c.restore()}star(c,5,-13,2.5,'#ffe066',time);break;
  case'threads':for(let i=0;i<3;i++){c.strokeStyle=col;c.lineWidth=1.4;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-4+i*4,-6,-5+i*5,-12);c.stroke();circ(c,-5+i*5,-12,1.1,tint(col,30))}break;
  case'cone':ell(c,0,-6,4,6,col);c.strokeStyle=tint(col,-35);c.lineWidth=.7;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-3.5,-9+i*3);c.quadraticCurveTo(0,-7+i*3,3.5,-9+i*3);c.stroke()}poly(c,[0,-12,3,-15,2,-11],'#7aae4a');break;
  default:circ(c,0,-5,5,col)}
  c.restore()}

// ---------- dünya oluşturma ----------
const GR=0,WA=1,BR=2,PA=3,PL=4,FI=5,PI=6;
const LAKE={x:9,y:17.6,rx:3.4,ry:2.5};const lakeSet=new Set();
const tile=new Uint8Array(MW*MH),block=new Uint8Array(MW*MH),tnoise=new Float32Array(MW*MH);
const rockAt=new Array(MW*MH).fill(null);
const streamX=y=>16+3*Math.sin(y*.3)+1.4*Math.sin(y*.13+1.3);
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const i=y*MW+x;tnoise[i]=R();let t=GR;
  if(Math.abs(x+.5-streamX(y+.5))<1.05)t=WA;
  if((x<=9&&y<=6)||(x<=5&&y>=7&&y<=12))t=PL;
  if(t!==WA&&((y===9&&x>=5)||(x===5&&y>=5&&y<=9)))t=PA;
  if(t===WA&&(y===9||y===23||y===33))t=BR;
  if(Math.pow((x+.5-LAKE.x)/LAKE.rx,2)+Math.pow((y+.5-LAKE.y)/LAKE.ry,2)<1){t=WA;lakeSet.add(i)}
  if(y===17&&(x===6||x===7)){t=PI;lakeSet.delete(i)}
  if(x>=10&&x<=14&&y>=3&&y<=6&&t===GR)t=FI;
  tile[i]=t;if(t===WA)block[i]=1;
}

function passable(x,y,goal){if(x<0||y<0||x>=MW||y>=MH)return false;const i=y*MW+x;if(block[i])return false;const r=rockAt[i];if(r&&r.alive&&r!==goal)return false;return true}
function findPath(sx,sy,tx,ty,goalRock,reach=1.25){
  const start=sy*MW+sx;const isGoal=goalRock?(x,y)=>Math.hypot(x+.5-goalRock.x,y+.5-goalRock.y)<reach+.2&&!(rockAt[y*MW+x]&&rockAt[y*MW+x].alive):(x,y)=>x===tx&&y===ty;
  const open=[start],came=new Map(),gS=new Map([[start,0]]),f=new Map([[start,0]]);const closed=new Set();let it=0;
  while(open.length&&it++<3000){let bi=0;for(let i=1;i<open.length;i++)if(f.get(open[i])<f.get(open[bi]))bi=i;const cur=open.splice(bi,1)[0];
    const cx=cur%MW,cy=(cur/MW)|0;if(isGoal(cx,cy)){const path=[];let c=cur;while(c!==start){path.unshift({x:c%MW+.5,y:((c/MW)|0)+.5});c=came.get(c)}return path}
    closed.add(cur);
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!passable(nx,ny))continue;if(dx&&dy&&(!passable(cx+dx,cy)||!passable(cx,cy+dy)))continue;
      const ni=ny*MW+nx;if(closed.has(ni))continue;const ng=gS.get(cur)+(dx&&dy?1.414:1);if(ng<(gS.get(ni)??1e9)){came.set(ni,cur);gS.set(ni,ng);f.set(ni,ng+Math.hypot(nx-tx,ny-ty));if(!open.includes(ni))open.push(ni)}}}
  return null}

  const ax=x+sa*len,ay=y-ca*len*1;const bx=x+sa*len*.78,by=y-ca*len*.78;

    const sec=(t)=>{const h=document.createElement('div');h.className='sect';h.textContent=t;body.appendChild(h)};
    sec('Ses');
    const r1=document.createElement('div');r1.className='item setrow';r1.innerHTML=`<div class="tx"><div class="nm">Ses seviyesi</div><div class="ds">Kazma, kristal, kuş ve ağız komuzu sesleri</div></div><input type="range" id="volR" min="0" max="100" value="${Math.round(SET.vol*100)}" aria-label="Ses seviyesi"><b id="volV" style="width:40px;text-align:right">${Math.round(SET.vol*100)}%</b>`;body.appendChild(r1);
    const vr=r1.querySelector('#volR');vr.oninput=()=>{SET.vol=vr.value/100;r1.querySelector('#volV').textContent=vr.value+'%';if(Snd.master)Snd.master.gain.value=SET.vol;saveSet()};vr.onchange=()=>{Snd.pickup(3)};
    const r2=document.createElement('div');r2.className='item setrow';r2.innerHTML=`<div class="tx"><div class="nm">Sesi kapat</div><div class="ds">Kısayol: M</div></div>`;const tg=document.createElement('button');tg.className='btn'+(Snd.muted?'':' green');tg.textContent=Snd.muted?'Kapalı':'Açık';tg.onclick=()=>{toggleMute();renderPanel()};r2.appendChild(tg);body.appendChild(r2);
    sec('Oyun');
    const rc=document.createElement('div');rc.className='item setrow';rc.innerHTML=`<div class="tx"><div class="nm">Karakter</div><div class="ds">Oyun ilerlemen korunur</div></div>`;['f','m'].forEach(h=>{const b2=document.createElement('button');b2.className='btn'+((G.hero||'m')===h?' green':'');b2.textContent=HEROES[h].name;b2.onclick=()=>{G.hero=h;ensureWardrobe();save();say(h==='f'?'Merhaba, ben Umay.':'Merhaba, ben Korkut.');renderPanel()};rc.appendChild(b2)});body.appendChild(rc);
    const r3=document.createElement('div');r3.className='item setrow';r3.innerHTML=`<div class="tx"><div class="nm">İpuçları</div><div class="ds">Karakterinin kendi kendine konuşmaları ve yardımcı mesajlar</div></div>`;const th=document.createElement('button');th.className='btn'+(SET.hints?' green':'');th.textContent=SET.hints?'Açık':'Kapalı';th.onclick=()=>{SET.hints=!SET.hints;saveSet();renderPanel()};r3.appendChild(th);body.appendChild(r3);
    const found=Object.keys(G.found).length;const st=document.createElement('div');st.className='sellBox';st.innerHTML=`<div class="sellRow"><span>Altın</span><span>${Math.floor(G.gold).toLocaleString('tr-TR')}</span></div><div class="sellRow"><span>Toplam satış</span><span>${G.earned.toLocaleString('tr-TR')} altın</span></div><div class="sellRow"><span>Keşfedilen kaynak</span><span>${found}/${Object.keys(ITEMS).length}</span></div><div class="sellRow"><span>Meydan seviyesi</span><span>${marketLv()}/${MARKET_LEVELS.length-1}</span></div>`;body.appendChild(st);
    sec('Yeniden Başla');
    const r4=document.createElement('div');r4.className='item setrow danger';r4.innerHTML=`<div class="tx"><div class="nm">Oyunu sıfırla</div><div class="ds">Altın, eşyalar, kıyafetler, araçlar, defter ve meydan gelişimi silinir. Ses ayarların kalır.</div></div>`;
    const rb=document.createElement('button');rb.className='btn red';rb.textContent='Yeniden Başla';r4.appendChild(rb);body.appendChild(r4);
    const cf=document.createElement('div');cf.className='confirm hidden';cf.innerHTML=`<div class="nm">Emin misin?</div><div class="ds">Tüm ilerlemen kalıcı olarak silinecek ve oyun en baştan başlayacak. Bu işlem geri alınamaz.</div><div class="cbtns"><button class="btn" id="cNo">Vazgeç</button><button class="btn red" id="cYes">Evet, sıfırla</button></div>`;body.appendChild(cf);
    rb.onclick=()=>{cf.classList.remove('hidden');rb.disabled=true;cf.scrollIntoView({block:'nearest',behavior:'smooth'});cf.querySelector('#cNo').focus()};
    cf.querySelector('#cNo').onclick=()=>{cf.classList.add('hidden');rb.disabled=false};
    cf.querySelector('#cYes').onclick=()=>resetGame();
  }else if(panelOpen==='book'){head.className='book';$('panelTitle').textContent='Koleksiyon Defteri';
    const slot=(id)=>{const it=ITEMS[id];const f=id&&G.found[id]!==undefined;const w=document.createElement('div');w.className='slot'+(f?'':' locked')+(id?'':' empty');
      if(id){const cn=iconCanvas(x=>{x.translate(26,42);x.scale(2.5,2.5);drawGem(x,id,0,0,1,1)},40);cn.style.width='40px';cn.style.height='40px';w.appendChild(cn);const nm=document.createElement('div');nm.className='snm';nm.textContent=f?it.name:'???';w.appendChild(nm);if(f){const q=document.createElement('div');q.className='sq';q.textContent=`×${G.found[id]} · ${it.price} altın`;w.appendChild(q)}}
      return w};
    for(const cat of['maden','lokman','sarraf']){const P2=PROFS[cat];const all=[];P2.list.forEach(id=>{const d=NODES[id];all.push(id);if(d.t2)all.push(d.t2);if(d.t3)all.push(d.t3)});
      const h=document.createElement('div');h.className='sect';h.textContent=`${P2.name} (${all.filter(k=>G.found[k]!==undefined).length}/${all.length})`;body.appendChild(h);
      const hd=document.createElement('div');hd.className='trow thead';hd.innerHTML='<span>Kaynak</span><span>2. Seviye</span><span>3. Seviye</span>';body.appendChild(hd);
      P2.list.forEach(id=>{const d=NODES[id];const row=document.createElement('div');row.className='trow';row.append(slot(id),slot(d.t2),slot(d.t3));body.appendChild(row)})}
    const sectGrid=(title,keys,desc)=>{const h=document.createElement('div');h.className='sect';h.textContent=title;body.appendChild(h);const gg=document.createElement('div');gg.className='grid';
      keys.forEach(k=>{const f=G.found[k]!==undefined;const c=document.createElement('div');c.className='card'+(f?'':' locked');const cn=iconCanvas(x=>{x.translate(26,40);x.scale(2.6,2.6);drawGem(x,k,0,0,1,1)},64);cn.style.width='64px';cn.style.height='64px';c.appendChild(cn);
        const nm=document.createElement('div');nm.className='nm';nm.textContent=f?ITEMS[k].name:'???';c.appendChild(nm);const ds=document.createElement('div');ds.style.opacity=.75;ds.textContent=f?desc(k):'Henüz bulunmadı';c.appendChild(ds);gg.appendChild(c)});body.appendChild(gg)};
    sectGrid(`Balıklar (${Object.keys(FISH).filter(k=>G.found[k]!==undefined).length}/${Object.keys(FISH).length})`,Object.keys(FISH),k=>FISH[k].junk?`Tutulan: ${G.found[k]} · Kimin acaba?`:`Tutulan: ${G.found[k]} · Rekor: ${G.fishBest[k]||'-'} cm · ${FISH[k].price} altın`);
    const s2=document.createElement('div');s2.className='sect';s2.textContent=`Nadir Buluntular (${Object.keys(G.relics).length}/${Object.keys(RELICS).length})`;body.appendChild(s2);const g2=document.createElement('div');g2.className='grid';
    Object.keys(RELICS).forEach(id=>{const f=!!G.relics[id];const c=document.createElement('div');c.className='card'+(f?'':' locked');const cn=iconCanvas(relicIcon(id),64);cn.style.width='64px';cn.style.height='64px';c.appendChild(cn);const nm=document.createElement('div');nm.className='nm';nm.textContent=f?RELICS[id].name:'???';c.appendChild(nm);const ds=document.createElement('div');ds.style.opacity=.75;ds.textContent=f?RELICS[id].desc:'Bir madenin içinde saklı…';c.appendChild(ds);g2.appendChild(c)});body.appendChild(g2);
    const st=document.createElement('div');st.className='ds';st.style.cssText='font-size:13px;opacity:.75;padding:4px';st.textContent=`Toplam kazanç: ${G.earned.toLocaleString('tr-TR')} altın`;body.appendChild(st)}
}

// ---------- başlat ----------
let pickHero=G.hero||null;
if(matchMedia('(pointer:coarse)').matches){const k=document.querySelector('#intro .keys');if(k)k.textContent='Dokun: yürü, kaz, topla · Kaz düğmesi: en yakın kaynak · Dükkânlara dokunup alışveriş yap'}
document.querySelectorAll('.heroC').forEach(b=>{const h=b.dataset.h;b.querySelector('span').textContent=HEROES[h].desc;b.onclick=()=>{Snd.init();pickHero=h;document.querySelectorAll('.heroC').forEach(x=>x.classList.toggle('on',x===b));const sb=$('startBtn');sb.disabled=false;sb.textContent=`${HEROES[h].name} ile başla`;Snd.pickup(h==='f'?4:2)}});
if(pickHero)document.querySelector(`.heroC[data-h="${pickHero}"]`).click();
function drawPortraits(){if($('intro').classList.contains('hidden'))return;const keep={sr:P.spdR,ln:P.lean,w:G.wear,h:G.hero,v:G.vehicle,say:P.say,fish:P.fish,mv:P.moving,face:P.face,sw:P.swingT};const old=ctx;
  document.querySelectorAll('.heroC').forEach(b=>{const c=b.querySelector('canvas');const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);const s=iso(P.x,P.y);const k=3.1;x.setTransform(k,0,0,k,c.width/2-s.x*k,c.height*.93-s.y*k);
    ctx=x;G.hero=b.dataset.h;G.wear=(keep.h===b.dataset.h&&keep.w)?keep.w:defaultWear(b.dataset.h);G.vehicle=0;P.say=null;P.fish=null;P.moving=false;P.spdR=0;P.lean=0;P.face=b.dataset.h==='f'?1:-1;P.swingT=1;try{drawPlayer(time)}catch(e){}});
  ctx=old;P.spdR=keep.sr;P.lean=keep.ln;G.wear=keep.w;G.hero=keep.h;G.vehicle=keep.v;P.say=keep.say;P.fish=keep.fish;P.moving=keep.mv;P.face=keep.face;P.swingT=keep.sw}
$('startBtn').onclick=()=>{if(!pickHero)return;Snd.init();const first=!G.hero;G.hero=pickHero;ensureWardrobe();save();$('intro').classList.add('hidden');setTimeout(()=>{if(first)toast('Yakındaki kaynaklara tıkla ve toplamaya başla!',false,4);say(first?'Hadi Sarman, başlayalım.':'Yeniden merhaba, Sarman.')},300)};
updateHud();
if(SET.muted){Snd.muted=false;toggleMute()}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();drawPortraits();{const bite=P.fish&&P.fish.state==='bite';const at=$('actTxt');if(at&&at.textContent!==(bite?'Çek!':'Kaz')){at.textContent=bite?'Çek!':'Kaz'}$('actBtn').classList.toggle('bite',!!bite);$('actBtn').style.visibility=$('intro').classList.contains('hidden')?'':'hidden'}if(panelOpen==='tailor')drawPreview();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// test kancası
window.__game={MK,villagers,marketLv,G,P,rocks,forage,animals,CAT,reelIn,startFishingAt,gems,stat,sellAll,openPanel,closePanel,onTap,iso,camera:()=>({camX,camY,ZOOM,CW,CH})};
</script>
</body>
</html>
